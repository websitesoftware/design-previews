<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Page not found — WebsiteSoft</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --cobalt: #2c3480;
        --cobalt-hi: #8f96d0;
        --bg: #000;
        --fg: #fff;
        --fg-2: rgb(255 255 255 / 0.66);
        --line: rgb(255 255 255 / 0.14);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --cobalt-hi: #2c3480;
          --bg: #f4f2ee;
          --fg: #000;
          --fg-2: rgb(0 0 0 / 0.64);
          --line: rgb(0 0 0 / 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          radial-gradient(60vmax 60vmax at 70% 30%, rgb(44 52 128 / 0.55), transparent 60%),
          radial-gradient(40vmax 40vmax at 20% 80%, rgb(44 52 128 / 0.35), transparent 60%),
          var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .eye {
        position: fixed;
        right: 12vw;
        top: 18vh;
        width: 26vmin;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, #000 18%, var(--cobalt-hi) 20%, var(--cobalt) 46%, transparent 47%);
        box-shadow: 0 0 120px rgb(44 52 128 / 0.8);
        opacity: 0.85;
        animation: look 6s ease-in-out infinite;
      }
      @keyframes look {
        0%, 100% { transform: translate(0, 0); }
        30% { transform: translate(-3vmin, 1vmin); }
        60% { transform: translate(2vmin, -1vmin); }
      }
      .card {
        position: relative;
        width: min(560px, 100%);
        padding: clamp(24px, 5vw, 48px);
        border-radius: 18px;
        background: linear-gradient(155deg, rgb(255 255 255 / 0.08), transparent 55%), rgb(10 12 30 / 0.4);
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        box-shadow: 0 30px 70px -20px rgb(0 0 0 / 0.6), inset 0 1px 0 rgb(255 255 255 / 0.14), inset 0 0 0 1px var(--line);
      }
      @media (prefers-color-scheme: light) {
        .card { background: linear-gradient(155deg, rgb(255 255 255 / 0.6), transparent 55%), rgb(255 255 255 / 0.5); }
      }
      .label {
        font-family: ui-monospace, 'SFMono-Regular', monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      h1 {
        margin: 14px 0 12px;
        font-size: clamp(2.4rem, 7vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      em {
        font-family: 'Times New Roman', serif;
        font-weight: 400;
        color: var(--cobalt-hi);
      }
      p {
        margin: 0 0 28px;
        color: var(--fg-2);
        line-height: 1.55;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 50px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
      }
      a.btn:hover { background: var(--cobalt); color: #fff; }
      a:focus-visible { outline: 2px solid var(--cobalt-hi); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
    </style>
  </head>
  <body>
    <div class="eye" aria-hidden="true"></div>
    <main class="card">
      <span class="label">Error 404 · Iris looked everywhere</span>
      <h1>This page isn’t <em>here.</em></h1>
      <p>The link may be old, or the page moved. Everything we build is one click away from the home page.</p>
      <a class="btn" href="/">Back to WebsiteSoft →</a>
    </main>
  </body>
</html>
